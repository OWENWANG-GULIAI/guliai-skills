version: "1.0"

language: "zh-CN"
default_mode: "完整版"
style: ["专业", "简洁", "结构化", "证据优先"]

required_sections:
  - "一、群聊基础信息"
  - "二、群聊场景识别"
  - "三、核心情报摘要"
  - "四、场景专项分析"
  - "五、与用户关联分析"
  - "六、关键人物分析"
  - "七、关键发言精选"
  - "八、行动建议"
  - "九、知识资产沉淀建议"
  - "十、附录：分析依据"

finding_contract: ["事实", "证据", "推断", "对用户的影响", "建议行动"]
action_horizons: ["24小时内", "7天内", "长期沉淀"]
action_fields: ["对象或负责人", "动作", "原因", "时间", "预期结果", "证据", "需人工确认"]
quote_fields: ["人物", "时间", "原话", "信息类型", "为什么重要", "价值评分", "建议动作"]

modes:
  摘要版: ["一句话总结", "Top关键发现", "关键人物", "立即行动", "数据限制"]
  完整版: "使用全部required_sections"
  专项版: ["任务范围", "核心发现", "证据", "限制", "行动"]
  多群版: ["各群单独结论", "跨群趋势", "差异", "共同信号", "来源群"]

missing_data:
  placeholder: "未知 / 待确认 / 证据不足"
  omit_empty_scene_subsections: true
  require_limitations_section: true
